name: macOS

on:
  push:
    branches: [master, develop, "milestone/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  pull_request:
    branches: [master,develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        xcode: ["16.2"]
    runs-on: macos-14
    name: build (Xcode ${{ matrix.xcode }})
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DCARTAN_BUILD_TESTS=ON \
            -DCARTAN_BUILD_EXAMPLES=OFF \
            -DCARTAN_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  install-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen and NLopt
        run: brew install eigen nlopt

      # The matrix installs, relocates and consumes cartan in every configuration
      # it covers, including the backend cells, so the job needs nothing built
      # here: each cell drives its own trees from the checkout.
      - name: Configure the install matrix
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCARTAN_BUILD_TESTS=ON \
            -DCARTAN_CMAKE_FETCH_DEPS=OFF

      - name: Install, relocate and consume
        run: ctest --test-dir build -R install_matrix --output-on-failure

name: Linux

on:
  push:
    branches: [master, develop, 'milestone/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Which headers produce gcov records at all differs between the two
          # flavors, so each carries the record of what its own reports do not
          # reach; one shared record would make a difference between instruments
          # read as a defect.
          - compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            coverage: true
            gcov_executable: gcov-14
            unmeasured: tools/coverage_unmeasured.gcc.txt
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
            coverage: true
            gcov_executable: "llvm-cov-18 gcov"
            unmeasured: tools/coverage_unmeasured.clang.txt
          # Both instrumented entries are Debug, and so is the sanitizer job, so
          # without an entry that carries no coverage flag nothing on Linux
          # compiles the library at full optimization -- which is where two of
          # the diagnostics this project promotes to errors appear at all. The
          # absence of the flag is also what makes the Release branch of the
          # configure below reachable.
          - compiler: gcc-14-release
            cc: gcc-14
            cxx: g++-14

    runs-on: ubuntu-24.04
    name: ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v4

      # Two of the four numbers this job publishes differ only by one gcovr flag's
      # semantics, so an unpinned gcovr is an unpinned verdict.
      - name: Install gcovr
        if: matrix.coverage
        run: pip install gcovr==8.6

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          if [ "${{ matrix.coverage }}" = "true" ]; then
            # The examples are deliberately left at their default here and built
            # in the Release entry instead: compiling them would put their
            # instantiations into this build's gcov records, and the record of
            # which headers are unmeasured -- which this job checks and which is
            # written against the tested surface -- would go stale for a reason
            # that has nothing to do with coverage moving.
            cmake . -B build -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-Werror --coverage" \
              -DCMAKE_C_FLAGS="--coverage" \
              -DCARTAN_BUILD_TESTS=ON \
              -DCARTAN_BUILD_URDF=ON \
              -DCARTAN_CMAKE_FETCH_DEPS=ON
          else
            # The exclusion list is empty and that is a statement, not an
            # omission: every example and every tutorial is built here, and the
            # three tutorials are registered as tests so this job runs them too.
            # The one example gated on an optional backend is compiled wherever
            # that backend is enabled; no lane enables both today, so it is
            # unbuilt rather than excluded, and this is the only entry in that
            # list. Nothing is skipped for being known broken.
            cmake . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-Werror" \
              -DCARTAN_BUILD_TESTS=ON \
              -DCARTAN_BUILD_EXAMPLES=ON \
              -DCARTAN_BUILD_URDF=ON \
              -DCARTAN_BUILD_PROFILING=ON \
              -DCARTAN_CMAKE_FETCH_DEPS=ON
          fi

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure --no-tests=error

      # gcov keeps one record per template instantiation. The first invocation sums
      # them, so a header line instantiated five times weighs five; the second
      # collapses them, so a line counts once and is covered if any instantiation
      # ran it. The two answer different questions and both are published.
      #
      # The fetched dependencies are compiled with the same coverage flag and drop
      # their notes files under build/_deps, where the source paths they record
      # resolve against neither working directory gcov tries. Reading them is an
      # error that aborts the run, and nothing they measure is reportable here.
      - name: Generate coverage
        id: coverage
        if: matrix.coverage
        run: |
          set -o pipefail
          gcovr build \
            --root . \
            --gcov-executable "${{ matrix.gcov_executable }}" \
            --exclude-directory '.*/_deps/.*' \
            --filter lib/cartan-lie/include/ \
            --filter lib/cartan-serial-chain/include/ \
            --filter lib/cartan-analytical/include/ \
            --filter lib/cartan-urdf/include/ \
            --xml coverage-unmerged.xml \
            --txt coverage-unmerged.txt
          gcovr build \
            --root . \
            --gcov-executable "${{ matrix.gcov_executable }}" \
            --exclude-directory '.*/_deps/.*' \
            --merge-lines \
            --filter lib/cartan-lie/include/ \
            --filter lib/cartan-serial-chain/include/ \
            --filter lib/cartan-analytical/include/ \
            --filter lib/cartan-urdf/include/ \
            --xml coverage-merged.xml \
            --txt coverage-merged.txt
          python3 tools/check_coverage_report.py \
            --unmerged coverage-unmerged.xml \
            --merged coverage-merged.xml \
            --unmeasured ${{ matrix.unmeasured }} \
            --source-root . | tee -a "$GITHUB_STEP_SUMMARY"

      # Cobertura keys on (file, line) and defines no reduction for repeats, and the
      # unmerged document repeats a line once per instantiation: 25548 entries over
      # 4382 keys, 942 of which disagree about whether the line ran. Reducing it
      # last-wins gives 79.96% and max-wins 91.67% where its own header says 73.46%,
      # so a consumer's badge would contradict the log by up to eighteen points. The
      # merged document has exactly one entry per key and no such freedom, so that is
      # what is published; the unmerged figure goes out as text, which nothing reduces.
      - name: Upload to Codecov
        if: matrix.coverage && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage-merged.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # Retained when the checker rejects the reports, which is when they are worth
      # reading; skipped when an earlier step failed and there is nothing to keep.
      - name: Upload coverage reports
        if: always() && matrix.coverage && steps.coverage.conclusion != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.compiler }}
          if-no-files-found: error
          path: |
            coverage-unmerged.xml
            coverage-unmerged.txt
            coverage-merged.txt

  sanitize:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Warnings are errors here too, and the promotion goes into the same
          # variable as the sanitizer switches rather than replacing them: a
          # sanitizer build is a build like any other, and a diagnostic only this
          # configuration produces was invisible while this was the one Linux job
          # without the promotion.
          - name: asan-ubsan-debug
            build_type: Debug
            cc: clang-18
            cxx: clang++-18
            flags: "-Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
            link_flags: "-fsanitize=address,undefined"
          # Optimized, assertions compiled out, and the undefined-behavior
          # sanitizer made non-recovering: without -fno-sanitize-recover a
          # violation prints a diagnostic and the process still exits zero, so
          # the lane above cannot go red on one.
          - name: asan-ubsan-release
            build_type: Release
            cc: clang-18
            cxx: clang++-18
            flags: "-Werror -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined -g"
            link_flags: "-fsanitize=address,undefined"

    runs-on: ubuntu-24.04
    name: sanitize (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.link_flags }}" \
            -DCARTAN_BUILD_TESTS=ON \
            -DCARTAN_BUILD_URDF=ON \
            -DCARTAN_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  # The backend is acquired by cartan's own registry, so the revision this job
  # builds against has exactly one spelling in the tree and none here. This is
  # also the backend-enabled half of the profiling build; the Release entry above
  # is the minimal half. The target is built and not run: its liveness is the
  # link and the registration, and its workload belongs to a measurement study
  # rather than to a lane.
  optional-backends:
    runs-on: ubuntu-24.04
    name: optional backends

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DCARTAN_BUILD_TESTS=ON \
            -DCARTAN_BUILD_ARGMIN=ON \
            -DCARTAN_BUILD_URDF=ON \
            -DCARTAN_BUILD_PROFILING=ON \
            -DCARTAN_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure

  core-only:
    runs-on: ubuntu-24.04
    name: core only (URDF module off)

    steps:
      - uses: actions/checkout@v4

      # Every other Linux job builds with -DCARTAN_BUILD_URDF=ON, so this is
      # the only automated check that the kinematics core still builds and
      # tests against Eigen alone with the description module compiled out.
      - name: Configure
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DCARTAN_BUILD_TESTS=ON \
            -DCARTAN_BUILD_URDF=OFF \
            -DCARTAN_CMAKE_FETCH_DEPS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: cd build && ctest --output-on-failure --no-tests=error

  install-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen and NLopt
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libnlopt-cxx-dev

      # The matrix installs, relocates and consumes cartan in every configuration
      # it covers, including the backend cells, so the job needs nothing built
      # here: each cell drives its own trees from the checkout.
      - name: Configure the install matrix
        run: |
          cmake . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCARTAN_BUILD_PACKAGING_TESTS=ON \
            -DCARTAN_BUILD_NETWORK_TESTS=ON \
            -DCARTAN_CMAKE_FETCH_DEPS=OFF

      - name: Install, relocate and consume
        run: ctest --test-dir build -R install_matrix --output-on-failure --no-tests=error

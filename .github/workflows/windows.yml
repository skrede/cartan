name: Windows

on:
  push:
    branches: [master, develop, "milestone/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  pull_request:
    branches: [master,develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".planning/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake . -B build -A x64 `
            -DCARTAN_BUILD_TESTS=ON `
            -DCARTAN_BUILD_EXAMPLES=OFF `
            -DCARTAN_CMAKE_FETCH_DEPS=ON `
            '-DCMAKE_CXX_FLAGS=/std:c++latest /W4 /EHsc'

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: cd build && ctest -C Release --output-on-failure --timeout 30

  install-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Every cell the matrix drives configures a tree of its own, so the
      # toolchain file reaches them through the environment, which CMake reads as
      # the initial value of CMAKE_TOOLCHAIN_FILE, rather than through a command
      # line the harness deliberately does not have.
      - name: Install Eigen and NLopt
        run: |
          vcpkg install eigen3:x64-windows nlopt:x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The matrix installs, relocates and consumes cartan in every configuration
      # it covers, including the backend cells, so the job needs nothing built
      # here: each cell drives its own trees from the checkout.
      - name: Configure the install matrix
        run: |
          cmake . -B build -A x64 `
            -DCARTAN_BUILD_TESTS=ON `
            -DCARTAN_CMAKE_FETCH_DEPS=OFF `
            '-DCMAKE_CXX_FLAGS=/std:c++latest /EHsc'

      - name: Install, relocate and consume
        run: ctest --test-dir build -C Release -R install_matrix --output-on-failure
